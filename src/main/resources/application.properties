# ==============================================================================
# CONFIGURACIÓN GENERAL DEL SERVIDOR
# ==============================================================================
spring.application.name=shopify-api-core
server.port=8080
server.servlet.context-path=/api/v1
server.error.include-message=always
server.error.include-binding-errors=always

# ==============================================================================
# CONEXIÓN A BASE DE DATOS (POSTGRESQL - SUPABASE)
# ==============================================================================
# Session pooler de Supabase (IPv4, soporta sentencias preparadas). No usar el transaction pooler (6543) con Hibernate/Flyway.
spring.datasource.url=jdbc:postgresql://${DB_HOST:aws-0-us-east-2.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:require}&tcpKeepAlive=true
spring.datasource.username=${DB_USERNAME:postgres.whgvtrbrkaczambfozhr}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# CONTROL TOTAL DEL POOL DE CONEXIONES (HIKARICP)
# ==============================================================================
spring.datasource.hikari.pool-name=ShopifyHikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.auto-commit=true

# ==============================================================================
# CONFIGURACIÓN DE PERSISTENCIA (JPA / HIBERNATE)
# ==============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Conservar PascalCase estricto de PostgreSQL
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Timeouts a nivel JDBC / Transacción
spring.jpa.properties.jakarta.persistence.query.timeout=10000
spring.transaction.default-timeout=15

# ==============================================================================
# SERIALIZACIÓN JSON (JACKSON)
# ==============================================================================
# Salidas JSON de la API en snake_case
spring.jackson.property-naming-strategy=SNAKE_CASE

# Manejo de formatos de fecha ISO-8601 UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Optimización: no enviar valores nulos
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# ==============================================================================
# PROPIEDADES DE APLICACIÓN (JWT Y SUPABASE)
# ==============================================================================
jwt.secreto=${JWT_SECRET_KEY}
jwt.expiracion-ms=${JWT_EXPIRATION_TIME:86400000}

app.supabase.url=${SUPABASE_URL}
app.supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY}

# ==============================================================================
# CONFIGURACIÓN DE ENVÍO DE CORREO (SMTP / SPRING MAIL)
# ==============================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==============================================================================
# MIGRACIONES DE ESQUEMA (FLYWAY)
# ==============================================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# ==============================================================================
# LOGS (con id de correlacion)
# ==============================================================================
logging.pattern.level=%5p [%X{correlacionId:-}]

# ==============================================================================
# SUSCRIPCIONES
# ==============================================================================
# Q-015: una prueba gratuita por usuario (false = una por tienda)
app.suscripcion.prueba-una-por-usuario=true

# ==============================================================================
# PAGOS EN LÍNEA (STRIPE, MODO PRUEBA)
# ==============================================================================
# Vacías por defecto: sin clave, el pago en línea responde PAG-002. No escribir claves reales aquí.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# ==============================================================================
# NOTIFICACIONES (CORREO)
# ==============================================================================
# Sin correo (false) el envío se omite y solo se registra. Remitente y URL pública de los enlaces.
app.correo.habilitado=${MAIL_ENABLED:true}
app.correo.remitente=${MAIL_FROM:no-responder@shopifyclon.test}
app.web.url-base=${APP_WEB_URL:http://localhost:3000}
